  @keyframes nudge { 0%, 70%, 100% { transform: translateX(0); } 85% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .sweep, .nudge { animation: none; } }
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset=".55" stop-color="#ec4899"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="c"><rect x="2" y="2" width="1196" height="236" rx="36"/></clipPath></defs>
<rect x="2" y="2" width="1196" height="236" rx="36" fill="#120c1d" stroke="url(#g)" stroke-width="3"/>
<g clip-path="url(#c)">
  <circle cx="1080" cy="40" r="150" fill="#22d3ee" opacity="0.18"/>
  <circle cx="150" cy="230" r="120" fill="#ec4899" opacity="0.16"/>
